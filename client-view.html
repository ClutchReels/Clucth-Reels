<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clutch Reels · Portal</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0a;--card:#111111;--elevated:#1a1a1a;--border:#2a2a2a;
  --violet:#a855f7;--glow:#c084fc;--deep:#7e22ce;
  --text:#f0f0f0;--sub:#b0b0b0;--muted:#6a6a6a;
  --danger:#ff6b6b;--success:#a8e6cf;--warning:#ffd93d;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;padding-bottom:80px;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;background-image:repeating-linear-gradient(0deg,rgba(0,0,0,.03) 0px,rgba(0,0,0,.03) 2px,transparent 2px,transparent 6px);z-index:0;}

/* TOP BAR */
.top-bar{background:var(--card);border-bottom:1px solid var(--border);padding:14px 24px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
.logo{font-family:'Playfair Display',serif;font-size:19px;background:linear-gradient(135deg,#fff,var(--glow));-webkit-background-clip:text;background-clip:text;color:transparent;font-weight:700;}
.tagline{font-size:9px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-top:1px;}
.top-badge{background:rgba(168,85,247,.15);border:1px solid rgba(168,85,247,.3);color:var(--glow);font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;}

/* HERO */
.hero{padding:32px 24px 0;max-width:720px;margin:0 auto;}
.client-header{display:flex;align-items:center;gap:16px;margin-bottom:28px;}
.client-avatar{width:56px;height:56px;border-radius:14px;background:linear-gradient(135deg,var(--deep),var(--violet));display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:#fff;flex-shrink:0;}
.client-name{font-family:'Playfair Display',serif;font-size:24px;font-weight:700;line-height:1.1;margin-bottom:4px;}
.client-meta{font-size:12px;color:var(--sub);}
.client-stage{display:inline-flex;align-items:center;gap:6px;background:rgba(168,85,247,.12);border:1px solid rgba(168,85,247,.25);color:var(--glow);font-size:11px;font-weight:600;padding:4px 12px;border-radius:20px;margin-top:6px;}

/* ALERT BANNER */
.alert-banner{background:rgba(255,217,61,.06);border:1px solid rgba(255,217,61,.25);border-radius:14px;padding:14px 18px;margin-bottom:20px;display:flex;align-items:center;gap:12px;font-size:13px;color:var(--warning);animation:pulse-border 2s infinite;}
@keyframes pulse-border{0%,100%{border-color:rgba(255,217,61,.25)}50%{border-color:rgba(255,217,61,.6)}}

/* TABS */
.tabs-wrap{max-width:720px;margin:0 auto;padding:0 24px;position:sticky;top:57px;z-index:40;background:var(--bg);padding-top:8px;padding-bottom:8px;}
.tabs{display:flex;gap:4px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:4px;}
.tab{flex:1;padding:9px 8px;text-align:center;font-size:13px;font-weight:500;color:var(--muted);border-radius:9px;cursor:pointer;transition:all .15s;white-space:nowrap;}
.tab:hover{color:var(--sub);}
.tab.active{background:rgba(168,85,247,.18);color:var(--glow);font-weight:600;}

/* CONTENT */
.content{max-width:720px;margin:0 auto;padding:20px 24px 0;}
.section-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:var(--violet);font-weight:600;margin-bottom:16px;}

/* PROJECT CARD */
.proj-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;transition:border-color .2s;}
.proj-card:hover{border-color:rgba(168,85,247,.3);}
.proj-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;gap:12px;}
.proj-name{font-weight:700;font-size:15px;line-height:1.2;}
.proj-type{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-top:3px;}
.proj-estado{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 10px;border-radius:20px;flex-shrink:0;}
.pe-activo{background:rgba(168,85,247,.12);color:var(--violet);}
.pe-completado{background:rgba(168,230,207,.12);color:var(--success);}
.pe-pausado{background:rgba(255,217,61,.12);color:var(--warning);}

.prog-row{display:flex;align-items:center;gap:10px;margin-bottom:16px;}
.prog-track{flex:1;height:6px;background:var(--elevated);border-radius:3px;overflow:hidden;}
.prog-fill{height:100%;border-radius:3px;transition:.4s;}
.prog-label{font-size:11px;color:var(--sub);white-space:nowrap;font-weight:600;}

/* DELIVERABLE LIST */
.del-list{display:flex;flex-direction:column;}
.del-item{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid rgba(42,42,42,.6);font-size:13px;}
.del-item:last-child{border-bottom:none;padding-bottom:0;}
.del-num{font-size:10px;color:var(--muted);font-weight:700;min-width:20px;text-align:right;flex-shrink:0;}
.del-icon{font-size:15px;flex-shrink:0;}
.del-title{flex:1;color:var(--text);font-weight:500;line-height:1.3;}
.del-deadline{font-size:10px;color:var(--muted);flex-shrink:0;}

/* BADGES */
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:700;white-space:nowrap;flex-shrink:0;}
.b-pendiente{background:rgba(106,106,106,.15);color:var(--muted);}
.b-revision{background:rgba(59,130,246,.15);color:#60a5fa;border:1px solid rgba(59,130,246,.3);}
.b-aprobado{background:rgba(168,85,247,.12);color:var(--violet);}
.b-done{background:rgba(168,230,207,.1);color:var(--success);}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.55}}

/* APPROVE BUTTON */
.btn-aprobar{background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(96,165,250,.12));border:1px solid rgba(59,130,246,.4);color:#60a5fa;font-size:10px;font-weight:700;padding:4px 12px;border-radius:20px;cursor:pointer;transition:all .2s;letter-spacing:.3px;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.btn-aprobar:hover{background:rgba(59,130,246,.3);border-color:#60a5fa;color:#fff;}
.btn-aprobar:active{transform:scale(.96);}

/* TOAST */
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--elevated);border:1px solid rgba(168,85,247,.4);border-radius:12px;padding:12px 22px;font-size:13px;color:var(--text);z-index:999;pointer-events:none;animation:toast-in .2s ease;}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* MÉTRICAS */
.kpi-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:20px;}
@media(min-width:480px){.kpi-grid{grid-template-columns:repeat(4,1fr);}}
.kpi-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 14px;text-align:center;}
.kpi-val{font-family:'Playfair Display',serif;font-size:26px;font-weight:700;color:var(--violet);line-height:1;margin-bottom:4px;}
.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}

.met-section{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;}
.met-title{font-size:13px;font-weight:700;color:var(--text);margin-bottom:16px;display:flex;align-items:center;gap:8px;}
.met-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(42,42,42,.5);font-size:12px;}
.met-row:last-child{border-bottom:none;}
.met-periodo{color:var(--glow);font-weight:600;min-width:70px;}
.met-stat{text-align:right;color:var(--sub);}
.met-stat strong{color:var(--text);display:block;font-size:13px;}
.met-bar-wrap{flex:1;margin:0 12px;}
.met-bar{height:5px;background:var(--elevated);border-radius:3px;overflow:hidden;}
.met-bar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--deep),var(--glow));}
.delta-up{color:var(--success);font-size:10px;}
.delta-dn{color:var(--danger);font-size:10px;}

.format-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:20px;}
.format-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;}
.format-icon{font-size:22px;margin-bottom:6px;}
.format-name{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:4px;}
.format-count{font-family:'Playfair Display',serif;font-size:20px;font-weight:700;color:var(--violet);}

/* PROSPECCIÓN */
.road-stage{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;}
.stage-header{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.stage-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;}
.stage-name{font-weight:700;font-size:15px;}
.stage-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.phase-list{display:flex;flex-direction:column;gap:2px;}
.phase-item{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;border-bottom:1px solid rgba(42,42,42,.4);cursor:default;}
.phase-item:last-child{border-bottom:none;}
.phase-check{font-size:16px;flex-shrink:0;}
.phase-text{flex:1;color:var(--sub);}
.phase-item.done .phase-text{color:var(--text);}

.onb-card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px;}
.onb-title{font-size:13px;font-weight:700;margin-bottom:6px;}
.onb-bar-wrap{margin:10px 0;}
.onb-bar{height:8px;background:var(--elevated);border-radius:4px;overflow:hidden;}
.onb-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--deep),var(--glow));transition:.4s;}
.onb-pct{font-size:11px;color:var(--sub);margin-top:4px;}
.onb-steps{display:flex;flex-direction:column;gap:6px;margin-top:12px;}
.onb-step{display:flex;align-items:center;gap:10px;font-size:12px;}
.onb-step-icon{font-size:14px;flex-shrink:0;}
.onb-step-text{color:var(--sub);}
.onb-step.done .onb-step-text{color:var(--text);}

.empty{text-align:center;color:var(--muted);padding:48px 0;font-size:13px;line-height:1.6;}
.loader-msg{text-align:center;color:var(--muted);padding:80px 0;font-size:13px;}
.error-msg{text-align:center;color:var(--danger);padding:60px 20px;font-size:13px;line-height:1.7;}
.footer{text-align:center;margin-top:48px;font-size:10px;color:var(--muted);letter-spacing:.5px;}

/* PORTAL MODAL */
.pm-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:200;display:flex;align-items:flex-end;justify-content:center;}
@media(min-width:600px){.pm-bg{align-items:center;}}
.pm-box{background:var(--card);border:1px solid var(--border);border-radius:20px 20px 0 0;width:100%;max-width:720px;max-height:88vh;overflow-y:auto;padding:24px 20px 32px;}
@media(min-width:600px){.pm-box{border-radius:16px;margin:auto;}}
.pm-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.pm-title{font-weight:700;font-size:16px;}
.pm-close{background:none;border:none;color:var(--muted);font-size:24px;cursor:pointer;line-height:1;padding:0;}
.pm-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.pm-field{display:flex;flex-direction:column;gap:5px;}
.pm-field.full{grid-column:1/-1;}
.pm-label{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);}
.pm-input{background:var(--elevated);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:9px 12px;font-size:13px;font-family:inherit;outline:none;width:100%;}
.pm-input:focus{border-color:var(--violet);}
.pm-sep{grid-column:1/-1;font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--violet);margin:8px 0 2px;padding-top:10px;border-top:1px solid var(--border);}
.pm-save{grid-column:1/-1;background:linear-gradient(135deg,var(--deep),var(--violet));border:none;color:#fff;padding:14px;border-radius:10px;font-weight:700;font-size:14px;cursor:pointer;margin-top:8px;font-family:inherit;width:100%;}
.pm-save:active{opacity:.85;}
</style>
</head>
<body>

<div class="top-bar">
  <div>
    <div class="logo">Clutch Reels</div>
    <div class="tagline">content agency</div>
  </div>
  <div class="top-badge" id="top-stage" style="display:none;"></div>
</div>

<div id="app">
  <div class="loader-msg">Cargando tu portal…</div>
</div>

<script>
const SB_URL = 'https://ignutaeaqfsvixydrqit.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlnbnV0YWVhcWZzdml4eWRycWl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzNjQ1MjAsImV4cCI6MjA5Mzk0MDUyMH0.M0mvUN9mPZI71fczjRv4-5kOY9c8SiI8KURREH6TG3w';
const sb = supabase.createClient(SB_URL, SB_KEY);

const cid = new URLSearchParams(location.search).get('id');

const ICONS = { Video:'🎬', Reel:'📱', Foto:'📸', Carrusel:'🎨', Copy:'✍️', Ad:'🎯', Landing:'🌐', Email:'📧', Motion:'🎞', Podcast:'🎙', Historia:'📖' };
function iF(f){ return ICONS[f] || '📄'; }

const ESTADO_BADGE = {
  'Pendiente':        { label: 'En producción',  cls: 'b-pendiente' },
  'Revisión interna': { label: '👁 Para revisar', cls: 'b-revision'  },
  'Aprobado':         { label: 'Aprobado ✓',     cls: 'b-aprobado'  },
  'Finalizado':       { label: 'Entregado ✓',    cls: 'b-done'      },
};

function fmtMes(ym) {
  if (!ym) return '—';
  const [y, m] = ym.split('-');
  const meses = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  return (meses[parseInt(m,10)-1]||m) + ' ' + y;
}

let activeTab = 'workspace';
let DATA = {};

async function init() {
  if (!cid) {
    showError('Link inválido. Pedile a Clutch Reels tu link personalizado.');
    return;
  }
  try {
    const [cr, pr, dr, mr, rm, rml, hml] = await Promise.all([
      sb.from('clients').select('*').eq('id', cid).single(),
      sb.from('projects').select('*').eq('client_id', cid).neq('estado','cancelado').order('created_at',{ascending:false}),
      sb.from('deliverables').select('*').eq('client_id', cid).order('deadline',{ascending:true}),
      sb.from('metrics_history').select('*').eq('client_id', cid).order('periodo',{ascending:false}),
      sb.from('roadmap_items').select('*').eq('client_id', cid).order('orden'),
      sb.from('reel_metrics').select('*').eq('client_id', cid).order('fecha',{ascending:true}),
      sb.from('historia_metrics').select('*').eq('client_id', cid).order('fecha',{ascending:true}),
    ]);
    if (cr.error || !cr.data) { showError('No encontramos tu información.<br>Contactá a Clutch Reels.'); return; }
    DATA = {
      client: cr.data,
      projects: pr.data || [],
      deliverables: dr.data || [],
      metrics: mr.data || [],
      roadmap: rm.data || [],
      reelMetrics: rml.data || [],
      historiaMetrics: hml.data || [],
    };
    renderShell();
    renderTab('workspace');
  } catch(e) {
    showError('Error de conexión. Intentá de nuevo en unos minutos.');
  }
}

function renderShell() {
  const c = DATA.client;
  const ini = (c.name||'?').split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase();
  const pipeline = c.pipeline || '';
  const stageEl = document.getElementById('top-stage');
  if (pipeline && pipeline !== 'Archivado') { stageEl.textContent = pipeline; stageEl.style.display = ''; }

  const pendReview = DATA.deliverables.filter(d => d.estado === 'Revisión interna').length;
  const alertHtml = pendReview > 0
    ? `<div class="alert-banner"><span style="font-size:20px;">👁</span><span>Tenés <strong>${pendReview} ${pendReview===1?'contenido':'contenidos'}</strong> listo${pendReview===1?'':'s'} para revisar y aprobar.</span></div>`
    : '';

  document.getElementById('app').innerHTML = `
    <div class="hero">
      <div class="client-header">
        <div class="client-avatar">${ini}</div>
        <div>
          <div class="client-name">${c.name}</div>
          <div class="client-meta">${c.industria||''}</div>
          ${pipeline ? `<div class="client-stage">● ${pipeline}</div>` : ''}
        </div>
      </div>
      <div id="alert-wrap">${alertHtml}</div>
    </div>
    <div class="tabs-wrap">
      <div class="tabs">
        <div class="tab active" id="tab-workspace" onclick="renderTab('workspace')">💼 Workspace</div>
        <div class="tab" id="tab-metricas" onclick="renderTab('metricas')">📊 Métricas</div>
        <div class="tab" id="tab-prospeccion" onclick="renderTab('prospeccion')">🚀 Prospección</div>
      </div>
    </div>
    <div class="content" id="tab-content"></div>
    <div class="content"><div class="footer">Portal en tiempo real · Clutch Reels</div></div>
  `;
}

function renderTab(tab) {
  activeTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  const tabEl = document.getElementById('tab-'+tab);
  if (tabEl) tabEl.classList.add('active');
  const el = document.getElementById('tab-content');
  if (!el) return;
  if (tab === 'workspace')         el.innerHTML = buildWorkspace();
  else if (tab === 'metricas')   { el.innerHTML = buildMetricas(); initMetricaCharts(); }
  else if (tab === 'prospeccion')  el.innerHTML = buildProspeccion();
}

// ══════════════════════════════
// WORKSPACE
// ══════════════════════════════
function buildWorkspace() {
  const { projects, deliverables } = DATA;
  if (!projects.length) return '<div class="empty">No hay proyectos activos por el momento.<br><br>Tu equipo de Clutch Reels los cargará pronto.</div>';

  let html = `<div class="section-label">Tus proyectos activos</div>`;

  projects.forEach(p => {
    const linked = deliverables.filter(d => d.project_id === p.id)
      .sort((a,b) => (a.deadline||'').localeCompare(b.deadline||''));
    const done  = linked.filter(d => d.estado === 'Finalizado').length;
    const total = parseInt(p.total_entregables) > 0 ? parseInt(p.total_entregables) : linked.length || 0;
    const pct   = total > 0 ? Math.round((done / total) * 100) : 0;
    const fill  = pct >= 80 ? 'var(--success)' : pct >= 40 ? 'var(--violet)' : 'var(--glow)';
    const estadoCls = { activo:'pe-activo', completado:'pe-completado', pausado:'pe-pausado' }[p.estado] || 'pe-activo';

    html += `<div class="proj-card">
      <div class="proj-header">
        <div>
          <div class="proj-name">${p.nombre}</div>
          ${p.descripcion ? `<div class="proj-type">${p.descripcion}</div>` : ''}
        </div>
        <div class="proj-estado ${estadoCls}">${p.estado||'activo'}</div>
      </div>
      <div class="prog-row">
        <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${fill};"></div></div>
        <div class="prog-label">${done}/${total} · ${pct}%</div>
      </div>
      <div class="del-list">
        ${linked.length ? linked.map((d, i) => {
          const info = ESTADO_BADGE[d.estado] || { label: d.estado, cls: 'b-pendiente' };
          const deadline = d.deadline ? `<span class="del-deadline">${d.deadline.slice(5).replace('-','/')}</span>` : '';
          const action = d.estado === 'Revisión interna'
            ? `<button class="btn-aprobar" onclick="aprobarEntregable('${d.id}')">✓ Aprobar</button>`
            : `<span class="badge ${info.cls}">${info.label}</span>`;
          return `<div class="del-item">
            <span class="del-num">${i+1}</span>
            <span class="del-icon">${iF(d.formato)}</span>
            <span class="del-title">${d.titulo}</span>
            ${deadline}
            ${action}
          </div>`;
        }).join('') : '<div style="font-size:12px;color:var(--muted);padding:8px 0;">Sin entregables cargados aún.</div>'}
      </div>
    </div>`;
  });

  // Entregables sin proyecto
  const sinProyecto = deliverables.filter(d => !d.project_id);
  if (sinProyecto.length) {
    html += `<div class="section-label" style="margin-top:8px;">Contenidos sueltos</div>
    <div class="proj-card">
      <div class="del-list">
        ${sinProyecto.map(d => {
          const info = ESTADO_BADGE[d.estado] || { label: d.estado, cls: 'b-pendiente' };
          const action = d.estado === 'Revisión interna'
            ? `<button class="btn-aprobar" onclick="aprobarEntregable('${d.id}')">✓ Aprobar</button>`
            : `<span class="badge ${info.cls}">${info.label}</span>`;
          return `<div class="del-item">
            <span class="del-icon">${iF(d.formato)}</span>
            <span class="del-title">${d.titulo}</span>
            ${action}
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  return html;
}

// MÉTRICAS

function buildMetricas() {
  const { reelMetrics, historiaMetrics } = DATA;
  let html = '';

  // ── REELS ──
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <div class="section-label" style="margin:0;">📱 Reels</div>
    <button class="btn-aprobar" onclick="showPortalMetricaForm('reel')">➕ Cargar datos</button>
  </div>`;

  if (reelMetrics.length) {
    const last = reelMetrics[reelMetrics.length-1];
    const avgViews = Math.round(reelMetrics.reduce((a,r)=>a+(r.views_24h||0),0)/reelMetrics.length);
    const avgRet   = (reelMetrics.reduce((a,r)=>a+(parseFloat(r.retencion_3s_24h)||0),0)/reelMetrics.length).toFixed(1);
    const totLikes = reelMetrics.reduce((a,r)=>a+(r.likes_24h||0),0);
    html += `<div class="kpi-grid" style="margin-bottom:14px;">
      <div class="kpi-card"><div class="kpi-val">${(last.views_24h||0).toLocaleString()}</div><div class="kpi-label">Último · Views</div></div>
      <div class="kpi-card"><div class="kpi-val">${avgViews.toLocaleString()}</div><div class="kpi-label">Views prom.</div></div>
      <div class="kpi-card"><div class="kpi-val">${avgRet}%</div><div class="kpi-label">Ret. 3s prom.</div></div>
      <div class="kpi-card"><div class="kpi-val">${totLikes.toLocaleString()}</div><div class="kpi-label">Likes totales</div></div>
    </div>
    <div class="met-section" style="padding:16px 20px;margin-bottom:12px;">
      <div class="met-title">📊 Views 24h</div>
      <canvas id="chart-reel-views" height="160"></canvas>
    </div>
    <div class="met-section" style="padding:16px 20px;margin-bottom:24px;">
      <div class="met-title">🎯 Retención 3s %</div>
      <canvas id="chart-reel-ret" height="140"></canvas>
    </div>`;
  } else {
    html += `<div class="empty" style="padding:28px 0;margin-bottom:20px;">Sin registros de Reels aún.<br>¡Cargá el primero para ver el análisis!</div>`;
  }

  // ── HISTORIAS ──
  html += `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <div class="section-label" style="margin:0;">📖 Historias</div>
    <button class="btn-aprobar" onclick="showPortalMetricaForm('historia')" style="border-color:rgba(96,165,250,.4);color:#60a5fa;">➕ Cargar datos</button>
  </div>`;

  if (historiaMetrics.length) {
    const last = historiaMetrics[historiaMetrics.length-1];
    const avgAlcance = Math.round(historiaMetrics.reduce((a,h)=>a+(h.alcance||0),0)/historiaMetrics.length);
    const totClics   = historiaMetrics.reduce((a,h)=>a+(h.clics_enlace||0),0);
    const avgAbandono = Math.round(historiaMetrics.reduce((a,h)=>a+(h.abandonos||0),0)/historiaMetrics.length);
    html += `<div class="kpi-grid" style="margin-bottom:14px;">
      <div class="kpi-card"><div class="kpi-val">${(last.alcance||0).toLocaleString()}</div><div class="kpi-label">Último · Alcance</div></div>
      <div class="kpi-card"><div class="kpi-val">${avgAlcance.toLocaleString()}</div><div class="kpi-label">Alcance prom.</div></div>
      <div class="kpi-card"><div class="kpi-val">${totClics}</div><div class="kpi-label">Clics enlace</div></div>
      <div class="kpi-card"><div class="kpi-val">${avgAbandono}</div><div class="kpi-label">Abandono prom.</div></div>
    </div>
    <div class="met-section" style="padding:16px 20px;margin-bottom:12px;">
      <div class="met-title">📊 Alcance</div>
      <canvas id="chart-hist-alcance" height="160"></canvas>
    </div>
    <div class="met-section" style="padding:16px 20px;margin-bottom:24px;">
      <div class="met-title">👁 Taps adelante vs Abandonos</div>
      <canvas id="chart-hist-taps" height="140"></canvas>
    </div>`;
  } else {
    html += `<div class="empty" style="padding:28px 0;">Sin registros de Historias aún.<br>¡Cargá el primero para ver el análisis!</div>`;
  }

  return html;
}

// ══════════════════════════════
// PROSPECCIÓN
// ══════════════════════════════
function buildProspeccion() {
  const { client, roadmap, deliverables } = DATA;

  let html = '';

  // Onboarding
  const onb = client.onboarding || {};
  const steps = [
    { key:'accesos',          label:'Accesos a redes y plataformas' },
    { key:'brand',            label:'Brand kit (logo, paleta, tipografías)' },
    { key:'referencias',      label:'Referencias visuales y de tono' },
    { key:'objetivos',        label:'Objetivos comerciales claros' },
    { key:'primerCalendario', label:'Primer calendario de contenido aprobado' },
  ];
  const doneSteps = steps.filter(s=>onb[s.key]).length;
  const pctOnb = Math.round((doneSteps/steps.length)*100);

  html += `<div class="section-label">Estado del onboarding</div>
  <div class="onb-card">
    <div style="display:flex;justify-content:space-between;align-items:center;">
      <div class="onb-title">Incorporación</div>
      <span style="font-size:20px;font-family:'Playfair Display',serif;font-weight:700;color:var(--violet);">${pctOnb}%</span>
    </div>
    <div class="onb-bar-wrap"><div class="onb-bar"><div class="onb-fill" style="width:${pctOnb}%;"></div></div></div>
    <div class="onb-steps">
      ${steps.map(s => `
        <div class="onb-step ${onb[s.key]?'done':''}">
          <span class="onb-step-icon">${onb[s.key]?'✅':'⬜'}</span>
          <span class="onb-step-text">${s.label}</span>
        </div>`).join('')}
    </div>
  </div>`;

  // Roadmap
  if (roadmap.length) {
    html += `<div class="section-label">Hoja de ruta</div>
    <div class="road-stage">
      <div class="phase-list">
        ${roadmap.map(r => `
          <div class="phase-item ${r.completado?'done':''}">
            <span class="phase-check">${r.completado?'✅':'⬜'}</span>
            <span class="phase-text">${r.fase}</span>
          </div>`).join('')}
      </div>
    </div>`;
  }

  // Próximos entregables
  const hoy = new Date().toISOString().slice(0,10);
  const proximos = deliverables
    .filter(d => d.deadline && d.deadline >= hoy && d.estado !== 'Finalizado')
    .sort((a,b) => a.deadline.localeCompare(b.deadline))
    .slice(0,5);

  if (proximos.length) {
    html += `<div class="section-label">Próximas entregas</div>
    <div class="proj-card">
      <div class="del-list">
        ${proximos.map(d => {
          const info = ESTADO_BADGE[d.estado] || { label: d.estado, cls: 'b-idea' };
          const fecha = d.deadline.slice(5).replace('-','/');
          return `<div class="del-item">
            <span class="del-icon">${iF(d.formato)}</span>
            <span class="del-title">${d.titulo}</span>
            <span class="del-deadline">📅 ${fecha}</span>
            <span class="badge ${info.cls}">${info.label}</span>
          </div>`;
        }).join('')}
      </div>
    </div>`;
  }

  // Estrategia
  if (client.estrategia) {
    html += `<div class="section-label">Estrategia de contenido</div>
    <div class="proj-card">
      <div style="font-size:13px;color:var(--sub);line-height:1.6;">${client.estrategia}</div>
    </div>`;
  }

  if (!roadmap.length && !proximos.length && !client.estrategia) {
    html += '<div class="empty">Tu hoja de ruta está en preparación.<br>Pronto vas a ver los próximos pasos acá.</div>';
  }

  return html;
}

function updateAlertBanner() {
  const el = document.getElementById('alert-wrap');
  if (!el) return;
  const pendReview = DATA.deliverables.filter(d => d.estado === 'Revisión interna').length;
  el.innerHTML = pendReview > 0
    ? `<div class="alert-banner"><span style="font-size:20px;">👁</span><span>Tenés <strong>${pendReview} ${pendReview===1?'contenido':'contenidos'}</strong> listo${pendReview===1?'':'s'} para revisar y aprobar.</span></div>`
    : '';
}

async function aprobarEntregable(id) {
  try {
    const { error } = await sb.from('deliverables').update({ estado: 'Aprobado' }).eq('id', id);
    if (error) throw error;
    const d = DATA.deliverables.find(x => x.id === id);
    if (d) d.estado = 'Aprobado';
    renderTab('workspace');
    updateAlertBanner();
    toast('✓ Contenido aprobado');
  } catch(e) {
    toast('Error al aprobar. Intentá de nuevo.');
  }
}

function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

let _charts = [];

function chartOpts() {
  return {
    responsive: true,
    plugins: { legend: { labels: { color:'#b0b0b0', font:{size:11,family:'Inter'}, boxWidth:12, padding:16 } } },
    scales: {
      x: { ticks:{color:'#6a6a6a',font:{size:10,family:'Inter'}}, grid:{color:'rgba(255,255,255,0.04)'} },
      y: { ticks:{color:'#6a6a6a',font:{size:10,family:'Inter'}}, grid:{color:'rgba(255,255,255,0.04)'},
           beginAtZero:true }
    }
  };
}

function initMetricaCharts() {
  _charts.forEach(c => c.destroy());
  _charts = [];

  const reels = DATA.reelMetrics;
  if (reels.length) {
    const labels = reels.map(r => r.fecha.slice(5).replace('-','/'));

    const elV = document.getElementById('chart-reel-views');
    if (elV) _charts.push(new Chart(elV, {
      type:'bar',
      data:{ labels, datasets:[{
        label:'Views 24h', data:reels.map(r=>r.views_24h||0),
        backgroundColor:'rgba(168,85,247,0.5)', borderColor:'#a855f7', borderWidth:1, borderRadius:4
      }]},
      options: chartOpts()
    }));

    const elR = document.getElementById('chart-reel-ret');
    if (elR) _charts.push(new Chart(elR, {
      type:'line',
      data:{ labels, datasets:[
        { label:'Ret. 3s 24h %', data:reels.map(r=>parseFloat(r.retencion_3s_24h)||0),
          borderColor:'#c084fc', backgroundColor:'rgba(192,132,252,0.1)',
          tension:0.4, fill:true, pointRadius:4, pointBackgroundColor:'#c084fc' },
        { label:'Ret. 3s 6h %', data:reels.map(r=>parseFloat(r.retencion_3s_6h)||0),
          borderColor:'rgba(168,85,247,0.4)', backgroundColor:'transparent',
          tension:0.4, borderDash:[4,4], pointRadius:3 }
      ]},
      options: chartOpts()
    }));
  }

  const hists = DATA.historiaMetrics;
  if (hists.length) {
    const labels = hists.map(h => h.fecha.slice(5).replace('-','/'));

    const elA = document.getElementById('chart-hist-alcance');
    if (elA) _charts.push(new Chart(elA, {
      type:'bar',
      data:{ labels, datasets:[{
        label:'Alcance', data:hists.map(h=>h.alcance||0),
        backgroundColor:'rgba(96,165,250,0.5)', borderColor:'#60a5fa', borderWidth:1, borderRadius:4
      }]},
      options: chartOpts()
    }));

    const elT = document.getElementById('chart-hist-taps');
    if (elT) _charts.push(new Chart(elT, {
      type:'bar',
      data:{ labels, datasets:[
        { label:'Taps adelante', data:hists.map(h=>h.taps_adelante||0),
          backgroundColor:'rgba(168,230,207,0.5)', borderColor:'#a8e6cf', borderWidth:1, borderRadius:4 },
        { label:'Abandonos', data:hists.map(h=>h.abandonos||0),
          backgroundColor:'rgba(255,107,107,0.4)', borderColor:'#ff6b6b', borderWidth:1, borderRadius:4 }
      ]},
      options: chartOpts()
    }));
  }
}

function closePortalModal() {
  document.getElementById('pm-modal-bg').style.display = 'none';
}

async function submitPortalMetrica(e, tipo) {
  e.preventDefault();
  const f = Object.fromEntries(new FormData(e.target));
  f.client_id = cid;
  const intFields = tipo==='reel'
    ? ['agendas','calidad_perfiles','comentarios_6h','comentarios_24h','compartidos_6h','compartidos_24h','guardados_6h','guardados_24h','likes_6h','likes_24h','views_6h','views_24h']
    : ['agendas','alcance','abandonos','clics_enlace','num_historias','respuestas','taps_adelante','taps_atras','visitas_primera','visitas_ultima','votos_respuestas','calidad_perfil'];
  intFields.forEach(k=>{ if(f[k]!==undefined) f[k]=parseInt(f[k])||0; });
  if (tipo==='reel') { f.retencion_3s_6h=parseFloat(f.retencion_3s_6h)||0; f.retencion_3s_24h=parseFloat(f.retencion_3s_24h)||0; }
  const table = tipo==='reel' ? 'reel_metrics' : 'historia_metrics';
  try {
    const { data, error } = await sb.from(table).insert(f).select().single();
    if (error) throw error;
    if (tipo==='reel') { DATA.reelMetrics.push(data); DATA.reelMetrics.sort((a,b)=>a.fecha.localeCompare(b.fecha)); }
    else { DATA.historiaMetrics.push(data); DATA.historiaMetrics.sort((a,b)=>a.fecha.localeCompare(b.fecha)); }
    closePortalModal();
    renderTab('metricas');
    toast('✓ Datos guardados');
  } catch(err) { toast('Error al guardar. Intentá de nuevo.'); }
}

function showError(msg) {
  document.getElementById('app').innerHTML = `<div style="padding:40px 24px;"><div class="error-msg">${msg}</div></div>`;
}
